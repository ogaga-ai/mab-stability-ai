name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check core imports
        run: python -c "import numpy, scipy, plotly; print('Core imports OK')"

      - name: Syntax check all modules
        run: python -m py_compile app.py gemini_client.py hipe_analysis.py prompts.py

      - name: Validate HIPE analysis module
        run: python -c "from hipe_analysis import fit_decay_model; print('hipe_analysis OK')"
